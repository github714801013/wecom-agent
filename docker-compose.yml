services:
  wecom-agent:
    image: wecom-agent:latest
    container_name: wecom-agent
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      REQUEST_RAW_LOG_ENABLED: ${REQUEST_RAW_LOG_ENABLED:-false}
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
