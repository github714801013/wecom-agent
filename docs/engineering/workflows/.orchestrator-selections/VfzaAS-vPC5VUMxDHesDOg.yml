      skills:
      - show-me
      agent_prompt: 展示或整理本次 task 的有效产出：代码修改流程读取当前 canonical state 的阶段证据与正式产物，并在当前
        workspace 使用只读 Git 信息核对 git diff HEAD 和未跟踪代码文件；开发方案出具流程基于 jira-input 的原始需求转文本与
        grill-with-docs 的正式产出整理为结构化方案，并同时产出接口文档（接口路径、方法、入参/出参、字段说明与错误码）。`development_proposal_delivery`
        仅在方案、规格、任务拆分、实现、评审和 verify 全部完成后的最终 `show-me-jira` 节点执行一次反写；方案内容、接口文档、实现范围与验证结论必须统一展示后再写入。只展示可验证范围，不替代
        commit、push 或其他外部操作授权。整理完成后，若本任务输入来自 Jira 且原始需求快照记录有 Issue Key，直接调用jira 工具把整理结果反写：
        - jira.ai_proposal_field（AI 开发方案字段）：写入本轮结构化方案与接口文档； - jira.ai_requirement_field（AI
        需求分析字段）：写入 jira-input 阶段产出的原始需求转文本内容（含附件图片视觉分析结果）； - jira.reference_solution_field（参考方案字段）：人工提供的只读输入，任何阶段都不得写入；
        仅反写 ai_requirement_field、ai_proposal_field 以及当前流程 stage_prompts 中额外声明的字段（如发版流程字段），且均为：字段为空时直接写入；非空时把现有内容与本轮整理结果整合为一份完整内容后重新写入；这是
        Jira 任务的已声明动作，无需用户确认；写入失败时把失败信息写入本阶段 evidence，不阻塞本阶段完成与任务 done；无 Issue Key
        时跳过。 收尾展示时同时给出本次改动的 Git 页面差异对比地址：调用 `uv run --script <dev-spec-gen-root>/scripts/git_compare_url.py
        --base <canonical workspace 的 base_branch> [--commit <本次任务正式 evidence 中明确记录的提交
        SHA>]`；不得从当前 HEAD 猜测本次提交，不得省略 canonical base。把返回的 branch_url（分支对比页）展示给用户，有
        commit_url 时一并给出。必须同时转述脚本返回的 note：改动尚未提交/推送时该地址要等推送后才可见，并附本地核对命令 `git status
