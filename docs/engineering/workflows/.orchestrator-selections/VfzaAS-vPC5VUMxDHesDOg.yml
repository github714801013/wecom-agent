- id: show-me-end
  skill: show-me
  mcp: null
  execution_mode: main_agent
  kind: skill
  host_action: null
  reference_mutation: false
  skills:
  - show-me
  agent_prompt: 作为流程收尾节点展示本次 task 的最终有效产出：读取当前 canonical state 的阶段证据与正式产物，并在当前 workspace
    使用只读 Git 信息核对 git diff HEAD 和未跟踪代码文件。按已核实的各业务仓库分别调用只读 `orchestrator.py project-code-changes
    --workspace <业务仓库>`，逐项打印业务实现代码文件状态与绝对路径 absolute_path，不能只打印相对路径或目录；重命名打印 old_absolute_path
    → absolute_path，删除文件保留原绝对路径；已提交文件从本次提交证据的相对路径与其所属仓库根目录拼出绝对路径，不把干净工作区当作没有改动。代码文件清单排除测试文件、流程文档、技能自身文件与生成元数据，无业务代码变更时明确说明。必须逐条列出本次任务的全部核心调整点（含流程定义、校验逻辑、命令契约、提示词、测试与文档等每一类改动），逐项与阶段证据及正式产物交叉核对。若本任务存在原始需求（如
    docs/engineering/specs 下对应 task_id 的需求文档或已登记的原始需求产物），必须把本次实现逐项与原始需求核对，明确列出已覆盖项、遗漏项与偏离项；存在遗漏或偏离时不得判定收尾通过，须先补齐或显式说明。确认没有遗漏后才能收尾；只展示可验证范围，不执行任何写入，不替代
    commit、push 或其他外部操作授权。 收尾展示时同时给出本次改动的 Git 页面差异对比地址：调用 `uv run --script <dev-spec-gen-root>/scripts/git_compare_url.py
    --base <canonical workspace 的 base_branch> [--commit <本次任务正式 evidence 中明确记录的提交
    SHA>]`；不得从当前 HEAD 猜测本次提交，不得省略 canonical base。把返回的 branch_url（分支对比页）展示给用户，有 commit_url
    时一并给出。必须同时转述脚本返回的 note：改动尚未提交/推送时该地址要等推送后才可见，并附本地核对命令 `git status --short`、`git
    diff HEAD`。脚本任何非零退出或错误码（包括 remote_missing、platform_unrecognized、base_unresolved、head_unresolved、commit_invalid、git_command_failed）都必须原样转述并停止，不得猜平台、不得拼可能无效的链接；展示不替代
    commit/push 授权。
