    commit、push 或其他外部操作授权。 收尾展示时同时给出本次改动的 Git 页面差异对比地址：调用 `uv run --script <dev-spec-gen-root>/scripts/git_compare_url.py
    --base <canonical workspace 的 base_branch> [--commit <本次任务正式 evidence 中明确记录的提交
    SHA>]`；不得从当前 HEAD 猜测本次提交，不得省略 canonical base。把返回的 branch_url（分支对比页）展示给用户，有 commit_url
    时一并给出。必须同时转述脚本返回的 note：改动尚未提交/推送时该地址要等推送后才可见，并附本地核对命令 `git status --short`、`git
    diff HEAD`。脚本任何非零退出或错误码（包括 remote_missing、platform_unrecognized、base_unresolved、head_unresolved、commit_invalid、git_command_failed）都必须原样转述并停止，不得猜平台、不得拼可能无效的链接；展示不替代
    commit/push 授权。
