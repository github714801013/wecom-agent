      agent_prompt: 先判断当前 flow_definition.option_id，再按对应分支读取，不能先抓取 Jira 全字段。字段名只能从
        dev-spec-gen 配置（仓库托管的 `config.default.yml` 提供默认值，本地 `config.yml` 同名键覆盖）的 `jira.ai_requirement_field`、`jira.reference_solution_field`
        与 `jira.ai_proposal_field` 取得，不得在 jira-input、命令或提示词中写死 customfield 编号，也不得扫描技能目录推断工具。
        - development_jira_spec（Jira 参考方案驱动开发）：必须提供 Jira 地址或 Issue Key；无 Jira 输入时
        blocked，不得 skipped。仅调用 `jira-issue.py get <ISSUE_KEY> -f <ai_proposal_field>,<ai_requirement_field>,<reference_solution_field>
        --json` 或等价工具读取这三个字段；不读取 summary、description、parent、attachment、status 或其他业务字段，不抓取附件、链接正文。ai_proposal_field
        与 ai_requirement_field 必须各形成独立正式文件，reference_solution_field 非空时同样形成独立正式文件，并通过
        jira_input_snapshot 登记 field_identity、配置中的 source_field、output_file 与 snapshot_status=complete；ai_proposal_field
        或 ai_requirement_field 缺失、为空、读取失败、解析失败或归档失败时必须 blocked，不得回退原文或以 skipped/complete
        继续；reference_solution_field 为空时按权威链回退到 AI 开发方案并记录「权威来源缺失」。 - development_proposal（开发方案出具）：任务输入包含
        Jira 地址或 Issue Key 时自动触发；无 Jira 输入时使用 skip_basis=not_applicable，记录“未提供 Jira
        地址或 Issue Key，当前 Jira 输入节点不适用”。必须读取 `jira.reference_solution_field`（人工提供的参考方案，权威最高）、`jira.ai_proposal_field`
        与 `jira.ai_requirement_field` 三个配置字段并各自登记为正式产物，同时读取原始需求正文及附件，附件图片优先激活 vision-analyzer
        技能做视觉分析转文本；并读取当前任务 `assignee` 识别经办人，按已挂载 delivery/jira 正文的经办人与父级范围规则确定该任务的责任范围（父级参考方案只取该经办人的明确分工，冲突以当前任务为准），把经办人、来源与采纳范围一并登记；整理原始需求文本并登记为正式产物，不反写
        Jira 字段。 - development_proposal_delivery（开发方案交付闭环）：必须提供 Jira 地址或 Issue Key；必须读取
        `jira.reference_solution_field`（人工提供的参考方案，最高权威）、`jira.ai_proposal_field` 与
        `jira.ai_requirement_field` 并各自登记为正式产物，同时读取原始需求正文及附件，附件图片优先激活 vision-analyzer
        技能做视觉分析转文本；先完成方案、规格、任务拆分、实现、评审和验证，最后仅由 show-me-jira 一次反写 `jira.ai_requirement_field`、`jira.ai_proposal_field`
        与 `jira.release_plan_field`；除 implement 与末节点已声明的状态流转外，中间阶段不得反写 Jira，输入缺失或读取失败时
        blocked，不得 skipped。 - 其他 development 流程（需求开发）：无 Jira 输入时使用 skip_basis=not_applicable，记录“未提供
        Jira 地址或 Issue Key，当前 Jira 输入节点不适用”；有 Jira 输入时按既有需求读取规则获取 summary、description、parent、attachment、status
