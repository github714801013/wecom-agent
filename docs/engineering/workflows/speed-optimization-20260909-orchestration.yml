    summary、description、parent、attachment、status 或其他业务字段，不抓取附件、链接正文。两字段任一缺失、为空、读取失败或解析失败时必须
    blocked，不得回退原文或以 skipped 继续。字段名由配置指定且保持不变；当前任务和子需求任务都读取这两个同名字段，当前任务内容作为基线，子任务内容按
    Jira 层级作为补充合并并保留来源，冲突逐项标记后阻塞等待确认。若 Jira 返回对象、数组或 ADF 子字段，递归定位同名字段并提取其可见文本，提取结果为空才判定字段为空。将两字段完整文本及来源登记为正式
    output_files，保留路径与 SHA-256；参考方案是 to-spec 拆解基线，AI 需求原始文本作补充校验，冲突列出并请求用户确认；本阶段不反写
    Jira。 - development_proposal（开发方案出具）：任务输入包含 Jira 地址或 Issue Key 时自动触发；无 Jira 输入时按
    skipped 提交并记录依据。读取原始需求正文及附件，附件图片优先激活 vision-analyzer 技能做视觉分析转文本；整理原始需求文本并登记为正式产物，不反写
    Jira 字段。 - 其他 development 流程（需求开发）：无 Jira 输入时按 skipped 提交并记录依据；有 Jira 输入时按既有需求读取规则获取
