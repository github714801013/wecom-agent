  - id: jira-input
    skill: vision-analyzer
    mcp: null
    execution_mode: sub_agent
    kind: skill
    host_action: null
    reference_mutation: false
    skills:
    - vision-analyzer
    agent_prompt: 先判断当前 flow_definition.option_id，再按对应分支读取，不能先抓取 Jira 全字段。字段名只能从 `dev-spec-gen/config.yml`
      的 `jira.ai_requirement_field` 与 `jira.reference_solution_field` 取得，不得在 jira-input、命令或提示词中写死
      customfield 编号，也不得扫描技能目录推断工具。 - development_jira_spec（Jira 参考方案驱动开发）：必须提供 Jira
      地址或 Issue Key；无 Jira 输入时 blocked，不得 skipped。仅调用 `jira-issue.py get <ISSUE_KEY>
      -f <reference_solution_field>,<ai_requirement_field> --json` 或等价工具读取这两个字段；不读取
      summary、description、parent、attachment、status 或其他业务字段，不抓取附件、链接正文。两字段任一缺失、为空、读取失败或解析失败时必须
      blocked，不得回退原文或以 skipped 继续。字段名由配置指定且保持不变；当前任务和子需求任务都读取这两个同名字段，当前任务内容作为基线，子任务内容按
      Jira 层级作为补充合并并保留来源，冲突逐项标记后阻塞等待确认。若 Jira 返回对象、数组或 ADF 子字段，递归定位同名字段并提取其可见文本，提取结果为空才判定字段为空。将两字段完整文本及来源登记为正式
      output_files，保留路径与 SHA-256；参考方案是 to-spec 拆解基线，AI 需求原始文本作补充校验，冲突列出并请求用户确认；本阶段不反写
      Jira。 - development_proposal（开发方案出具）：任务输入包含 Jira 地址或 Issue Key 时自动触发；无 Jira
      输入时按 skipped 提交并记录依据。读取原始需求正文及附件，附件图片优先激活 vision-analyzer 技能做视觉分析转文本；整理原始需求文本并登记为正式产物，不反写
      Jira 字段。 - 其他 development 流程（需求开发）：无 Jira 输入时按 skipped 提交并记录依据；有 Jira 输入时按既有需求读取规则获取
      summary、description、parent、attachment、status 及两个配置字段，优先使用 AI 需求分析与参考方案；只有字段缺失或内容不清晰且必要时才使用原文和附件。
      读取失败、配置字段无效或附件图片无法分析时如实记录并阻塞，不得静默回退或猜测。
