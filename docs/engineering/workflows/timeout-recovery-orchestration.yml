  - id: code-review
    skill: code-review
    mcp: null
    execution_mode: main_agent
    kind: skill
    host_action: null
    reference_mutation: false
    skills:
    - code-review
    - ponytail-review
    agent_prompt: 主 Agent 必须直接审核本次修改文件相对 HEAD 的未提交改动，以 git diff HEAD 为范围；无未提交差异时如实记录范围为空，不得猜测提交范围，不审查
      HEAD^..HEAD。完成 code-review 后继续执行 ponytail-review。 节点公开 review_manifest 时以其中
      files 为唯一审查清单：files 是「已声明 task_files ∩ 已跟踪改动」（?? 为声明的未跟踪新增，missing 为声明的已删除），excluded
      是范围外的其他已跟踪改动、仅审计不审查；未声明 task_files 时回退审查全部已跟踪改动并如实标注。修复后只复审 sha256 变化的文件，不得重新全文复审；当前
      HEAD 与 review_manifest.head 不一致时退化为全量复审并如实记录原因。review_manifest.status=unavailable
      时按 git diff HEAD 全量审查并如实记录基线不可用原因，不得当作空清单。 派发审查子 Agent 必须带硬超时、输出上限与“结论充分即停”约束；无新增证据时不重复派发同一范围的审查。
    orchestration_mode: null
    evidence_policy: null
    fallback_verification:
    - 按 ponytail 精简原则复查本次改动是否存在超出需求的功能、投机性抽象或重复实现，结论写入 evidence。
    - 确认未新增未使用依赖、死代码或只为单次调用存在的抽象。
    - 核对命名、注释与缩进是否符合周围代码风格，未修改部分保持原样。
